<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИгра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#0a0d1c;
    --bg-deep:#060813;
    --tile:#2a3bdc;
    --tile-hi:#3c4dff;
    --tile-used:#141833;
    --tile-used-ink:#3a4170;
    --card:#11142b;
    --card-edge:rgba(255,255,255,.09);
    --ink:#f3f5ff;
    --ink-dim:#9aa3d1;
    --ink-faint:#5b6294;
    --mint:#39f2a4;
    --pink:#ff4fa6;
    --bad:#ff5d6c;
    --good:#39f2a4;
    --focus:#ffd166;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 82% -10%, rgba(255,79,166,.10), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(57,242,164,.08), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--pink);color:#140017;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  /* ---------- header ---------- */
  .topbar{
    padding:18px clamp(16px,3vw,36px) 10px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{
    font-family:"Unbounded",sans-serif;
    font-weight:900;
    font-size:clamp(22px,3vw,32px);
    letter-spacing:.01em;
    line-height:1;
  }
  .brand .mark span{color:var(--mint);}
  .brand .sub{
    font-size:12px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.14em;
    font-weight:700;
  }
  .reset-btn{
    background:transparent;
    border:1px solid var(--card-edge);
    color:var(--ink-dim);
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s, color .15s;
    white-space:nowrap;
  }
  .reset-btn:hover{border-color:var(--pink);color:var(--ink);}

  /* ---------- scoreboard ---------- */
  .scoreboard{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:0 clamp(16px,3vw,36px) 16px;
  }
  .team{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:14px;
    padding:8px 10px 8px 14px;
  }
  .team .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .team input.name{
    background:transparent;
    border:none;
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    width:104px;
    min-width:60px;
  }
  .team .score{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:16px;
    min-width:3.5ch;
    text-align:right;
    color:var(--mint);
  }
  .team .stepper{display:flex;gap:2px;}
  .team .stepper button{
    width:20px;height:20px;
    border-radius:6px;
    border:1px solid var(--card-edge);
    background:var(--bg-deep);
    color:var(--ink-dim);
    font-size:12px;
    line-height:1;
    cursor:pointer;
  }
  .team .stepper button:hover{color:var(--ink);border-color:var(--ink-faint);}
  .team .remove{
    border:none;background:transparent;color:var(--ink-faint);
    cursor:pointer;font-size:14px;padding:0 2px;
  }
  .team .remove:hover{color:var(--bad);}
  .add-team{
    display:flex;align-items:center;gap:6px;
    background:transparent;
    border:1px dashed var(--ink-faint);
    border-radius:14px;
    padding:8px 16px;
    color:var(--ink-dim);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .add-team:hover{border-color:var(--mint);color:var(--mint);}

  /* ---------- board ---------- */
  .board-wrap{
    flex:1;
    padding:4px clamp(16px,3vw,36px) clamp(16px,3vw,36px);
    display:flex;
  }
  .board{
    flex:1;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-rows:minmax(44px,1fr);
    gap:7px;
  }
  .cat-head{
    background:var(--bg-deep);
    border:1px solid var(--card-edge);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 6px;
    font-family:"Unbounded",sans-serif;
    font-weight:700;
    font-size:clamp(11px,1.15vw,15px);
    line-height:1.2;
    color:var(--ink);
  }
  .tile{
    background:var(--tile);
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:clamp(18px,2.4vw,30px);
    color:#fef9ff;
    cursor:pointer;
    transition:background .12s, transform .12s;
  }
  .tile:hover:not(:disabled){background:var(--tile-hi);transform:translateY(-2px);}
  .tile:disabled{
    background:var(--tile-used);
    color:var(--tile-used-ink);
    cursor:default;
    transform:none;
  }
  .tile:disabled::after{content:"✓";font-family:"Manrope",sans-serif;}

  /* ---------- modal ---------- */
  .veil{
    position:fixed;inset:0;
    background:rgba(4,5,12,.82);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
  }
  .veil[hidden]{display:none;}
  .stage-card{
    width:min(780px,100%);
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:20px;
    padding:clamp(24px,4vw,48px);
    position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .stage-card .close{
    position:absolute;top:16px;right:16px;
    width:34px;height:34px;border-radius:50%;
    background:transparent;border:1px solid var(--card-edge);
    color:var(--ink-dim);font-size:16px;cursor:pointer;
  }
  .stage-card .close:hover{color:var(--ink);border-color:var(--ink-faint);}
  .pills{display:flex;gap:10px;align-items:center;margin-bottom:22px;}
  .pill{
    font-family:"Unbounded",sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.03em;
    padding:7px 14px;
    border-radius:999px;
  }
  .pill.cat{background:rgba(57,242,164,.12);color:var(--mint);border:1px solid rgba(57,242,164,.3);}
  .pill.pts{background:rgba(255,79,166,.14);color:var(--pink);border:1px solid rgba(255,79,166,.32);font-family:"JetBrains Mono",monospace;}
  .q-text{
    font-family:"Unbounded",sans-serif;
    font-weight:600;
    font-size:clamp(20px,3.4vw,30px);
    line-height:1.3;
    text-wrap:balance;
    margin:0 0 8px;
  }
  .a-wrap{margin-top:22px;}
  .a-text{
    font-size:17px;
    font-weight:600;
    color:var(--mint);
    background:rgba(57,242,164,.08);
    border:1px solid rgba(57,242,164,.25);
    border-radius:12px;
    padding:14px 16px;
    margin:0;
  }
  .reveal-btn{
    background:var(--mint);
    color:#042417;
    border:none;
    border-radius:12px;
    padding:13px 24px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }
  .reveal-btn:hover{filter:brightness(1.08);}
  .award-row{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .award-btn{
    flex:1 1 150px;
    background:var(--bg-deep);
    border:1px solid var(--card-edge);
    color:var(--ink);
    border-radius:12px;
    padding:12px 14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s,background .15s;
  }
  .award-btn b{color:var(--mint);font-family:"JetBrains Mono",monospace;}
  .award-btn:hover{border-color:var(--mint);background:rgba(57,242,164,.07);}
  .skip-btn{
    flex:1 1 150px;
    background:transparent;
    border:1px dashed var(--ink-faint);
    color:var(--ink-dim);
    border-radius:12px;
    padding:12px 14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .skip-btn:hover{border-color:var(--bad);color:var(--bad);}

  .hint{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    padding:0 clamp(16px,3vw,36px) 14px;
  }

  .top-actions{display:flex;gap:8px;align-items:center;}
  .variant-sel{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--card-edge);
    border-radius:999px;
    padding:9px 14px;
    font:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px;}
  .opt{
    background:var(--bg-deep);
    border:1px solid var(--card-edge);
    border-radius:12px;
    padding:12px 14px;
    font-weight:700;
    font-size:15px;
    display:flex;gap:10px;align-items:center;
  }
  .opt .letter{
    font-family:"JetBrains Mono",monospace;
    background:rgba(255,255,255,.08);
    border-radius:6px;width:24px;height:24px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .opt.correct{background:rgba(57,242,164,.14);border-color:var(--good);color:var(--good);}
  .opt.dim{opacity:.45;}

  @media (max-width:760px){
    .opts{grid-template-columns:1fr;}
    .board{grid-auto-rows:minmax(38px,1fr);}
    .cat-head{font-size:10px;}
  }
/* Пасхальный ML-хардкор: вся страница уходит в красный.
   --good остаётся зелёным, чтобы «верно» не путалось с акцентом. */
body.ml{
  --bg:#14070a;
  --bg-deep:#0b0304;
  --tile:#a3121f;
  --tile-hi:#c81a2b;
  --tile-used:#2a0c10;
  --tile-used-ink:#6e2b33;
  --card:#1d0a0e;
  --card-edge:rgba(255,120,120,.13);
  --ink:#fff1f1;
  --ink-dim:#e0a7ab;
  --ink-faint:#9a5b61;
  --mint:#ff4d4d;
  --pink:#ffb020;
  background:
    radial-gradient(1200px 600px at 82% -10%, rgba(255,77,77,.22), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(255,176,32,.08), transparent 55%),
    var(--bg);
}
body.ml .pill.cat{background:rgba(255,77,77,.14);border-color:rgba(255,77,77,.4);}
body.ml .pill.pts{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35);}
.ml-badge{display:none;}
body.ml .ml-badge{
  display:inline-block;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#140507;
  background:var(--mint);
  border-radius:6px;
  padding:3px 8px;
  margin-left:8px;
  vertical-align:middle;
}
</style>

<div class="topbar">
  <div class="brand">
    <div class="mark" id="logo" style="touch-action:manipulation;user-select:none;">ИИ<span>гра</span><span class="ml-badge">ML hardcore</span></div>
    <div class="sub">Своя игра · 5 тем · 25 вопросов об искусственном интеллекте</div>
  </div>
  <div class="top-actions">
    <select class="variant-sel" id="variantSel" aria-label="Вариант вопросов"></select>
    <button class="reset-btn" id="resetBtn" type="button">Начать заново</button>
  </div>
</div>

<div class="scoreboard" id="scoreboard"></div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<p class="hint">Нажмите на цену вопроса, чтобы открыть его. Отвечает команда, которая первой подняла руку.</p>

<div class="veil" id="veil" hidden>
  <div class="stage-card" role="dialog" aria-modal="true" aria-labelledby="qText">
    <button class="close" id="closeBtn" type="button" aria-label="Закрыть">✕</button>
    <div class="pills">
      <span class="pill cat" id="pillCat"></span>
      <span class="pill pts" id="pillPts"></span>
    </div>
    <p class="q-text" id="qText"></p>
    <div class="opts" id="opts"></div>
    <div class="a-wrap">
      <button class="reveal-btn" id="revealBtn" type="button">Показать ответ</button>
      <p class="a-text" id="aText" hidden></p>
    </div>
    <div class="award-row" id="awardRow" hidden></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var VARIANTS = [[{"name": "История ИИ", "q": [{"p": 100, "q": "Как называется проверка, сможет ли машина в переписке сойти за человека?", "options": ["Тест Роршаха", "Тест Айзенка", "Тест Тьюринга", "Тест Бине"], "correct": 2}, {"p": 200, "q": "Как называлась система IBM, выигравшая в 2011 году телевикторину Jeopardy!?", "options": ["Summit", "Deep Blue", "Watson", "Blue Gene"], "correct": 2}, {"p": 300, "q": "В какой игре команда ботов OpenAI Five в 2019 году победила действующих чемпионов мира?", "options": ["StarCraft II", "League of Legends", "Counter-Strike", "Dota 2"], "correct": 3}, {"p": 400, "q": "Как назывался проект IBM, в котором ИИ с 2019 года публично вёл дебаты с чемпионами-людьми?", "options": ["Argus", "Project Debater", "Watson Debate", "Deep Speak"], "correct": 1}, {"p": 500, "q": "В какую игру играла программа Артура Самуэля 1959 года — та самая, с которой пошёл термин «машинное обучение»?", "options": ["Го", "Шашки", "Покер", "Шахматы"], "correct": 1}]}, {"name": "ИИ вокруг нас", "q": [{"p": 100, "q": "Как зовут голосового помощника Яндекса?", "options": ["Маруся", "Салют", "Марта", "Алиса"], "correct": 3}, {"p": 200, "q": "Как называется ИИ-инструмент фоторедактора смартфона, удаляющий лишние объекты со снимка?", "options": ["Кисть", "Лупа", "Ластик", "Пипетка"], "correct": 2}, {"p": 300, "q": "Какая ИИ-технология помогает галерее смартфона собирать альбомы с фото конкретного человека?", "options": ["Сжатие фото", "Автояркость", "Распознавание лиц", "Геолокация"], "correct": 2}, {"p": 400, "q": "Как называется нейросеть Сбера, рисующая картинки по текстовому описанию?", "options": ["Picasso", "Midjourney", "Шедеврум", "Kandinsky"], "correct": 3}, {"p": 500, "q": "Во что превращало фотографии российское приложение Prisma, ставшее хитом в 2016 году?", "options": ["В картины", "В мультфильмы", "В 3D-модели", "В стикеры"], "correct": 0}]}, {"name": "Кино и поп-культура", "q": [{"p": 100, "q": "Как зовут шарообразного дроида, ставшего любимцем зри mulation"], "correct": 0}, {"p": 400, "q": "Какой формат чисел имеет 8 бит экспоненты и 7 бит мантиссы?", "options": ["FP8", "bfloat16", "FP16", "TF32"], "correct": 1}, {"p": 500, "q": "Как называется параметризация, позволяющая переносить гиперпараметры с маленьких моделей на большие (muTransfer)?", "options": ["μP", "SP", "LoRA", "NTK"], "correct": 0}]}, {"name": "Трансформеры и LLM", "q": [{"p": 100, "q": "На что делится скалярное произведение запроса и ключа в scaled dot-product attention?", "options": ["d_k", "√n", "√d_k", "log d_k"], "correct": 2}, {"p": 200, "q": "Как называется позиционное кодирование, которое поворачивает векторы запросов и ключей?", "options": ["ALiBi", "Обучаемое", "RoPE", "Синусоидальное"], "correct": 2}, {"p": 300, "q": "Сколько токенов на один параметр примерно оптимально по законам масштабирования Chinchilla?", "options": ["≈1", "≈200", "≈20", "≈2"], "correct": 2}, {"p": 400, "q": "Как называется внимание, где группы голов запросов делят общие головы ключей и значений?", "options": ["MHA", "MQA", "GQA", "MLA"], "correct": 2}, {"p": 500, "q": "Как называется внимание DeepSeek-V2/V3, сжимающее ключи и значения в латентный вектор?", "options": ["MLA", "GQA", "Linformer", "MQA"], "correct": 0}]}, {"name": "Статьи и цифры", "q": [{"p": 100, "q": "Сколько параметров у самой большой версии GPT-3?", "options": ["540 млрд", "1,5 млрд", "1,8 трлн", "175 млрд"], "correct": 3}, {"p": 200, "q": "Какие две архитектуры предложены в word2vec?", "options": ["CBOW и Skip-gram", "GloVe и FastText", "LSA и LDA", "ELMo и BERT"], "correct": 0}, {"p": 300, "q": "Как называется эссе Ричарда Саттона 2019 года о том, что общие методы с ростом вычислений побеждают ручные знания?", "options": ["Горький урок", "Бесплатный обед", "Неразумная эффективность", "Сладкая ложь"], "correct": 0}, {"p": 400, "q": "Кто авторы оптимизатора Adam?", "options": ["Кингма и Ба", "Тилеман и Хинтон", "Лощилов и Хуттер", "Дучи и Хазан"], "correct": 0}, {"p": 500, "q": "Какую top-5 ошибку показала AlexNet на ILSVRC-2012?", "options": ["26,2%", "6,7%", "15,3%", "3,6%"], "correct": 2}]}]];
  var ML_INDEX = VARIANTS.length - 1;

  var DOT_COLORS = ["#39f2a4","#ff4fa6","#4fb8ff","#ffd166","#b98bff","#ff8a5d"];
  var STORE_KEY = "iigra-quiz-state-v2";

  var state = loadState() || {
    teams: [
      {id: cryptoId(), name:"Команда 1", score:0},
      {id: cryptoId(), name:"Команда 2", score:0},
      {id: cryptoId(), name:"Команда 3", score:0}
    ],
    used: {},
    variant: 0
  };
  if(!(state.variant >= 0 && state.variant < VARIANTS.length)) state.variant = 0;
  var DATA = VARIANTS[state.variant];

  function cryptoId(){ return "t" + Math.random().toString(36).slice(2,9); }

  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.teams) && parsed.used) return parsed;
    }catch(e){}
    return null;
  }

  var boardEl = document.getElementById("board");
  var scoreboardEl = document.getElementById("scoreboard");
  var veil = document.getElementById("veil");
  var pillCat = document.getElementById("pillCat");
  var pillPts = document.getElementById("pillPts");
  var qText = document.getElementById("qText");
  var optsEl = document.getElementById("opts");
  var variantSel = document.getElementById("variantSel");
  var aText = document.getElementById("aText");
  var revealBtn = document.getElementById("revealBtn");
  var awardRow = document.getElementById("awardRow");
  var closeBtn = document.getElementById("closeBtn");
  var resetBtn = document.getElementById("resetBtn");

  var current = null; // {ci, qi, points}

  function renderScoreboard(){
    scoreboardEl.innerHTML = "";
    state.teams.forEach(function(team, idx){
      var row = document.createElement("div");
      row.className = "team";

      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = DOT_COLORS[idx % DOT_COLORS.length];
      row.appendChild(dot);

      var input = document.createElement("input");
      input.className = "name";
      input.value = team.name;
      input.maxLength = 24;
      input.setAttribute("aria-label","Название команды");
      input.addEventListener("input", function(){
        team.name = input.value;
        saveState();
      });
      row.appendChild(input);

      var stepper = document.createElement("div");
      stepper.className = "stepper";
      var minus = document.createElement("button");
      minus.type = "button"; minus.textContent = "–";
      minus.title = "−100 очков";
      minus.addEventListener("click", function(){
        team.score -= 100; saveState(); renderScoreboard();
      });
      var plus = document.createElement("button");
      plus.type = "button"; plus.textContent = "+";
      plus.title = "+100 очков";
      plus.addEventListener("click", function(){
        team.score += 100; saveState(); renderScoreboard();
      });
      stepper.appendChild(minus);
      stepper.appendChild(plus);
      row.appendChild(stepper);

      var score = document.createElement("span");
      score.className = "score";
      score.textContent = team.score;
      row.appendChild(score);

      if(state.teams.length > 1){
        var remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "✕";
        remove.title = "Убрать команду";
        remove.addEventListener("click", function(){
          state.teams = state.teams.filter(function(t){ return t.id !== team.id; });
          saveState(); renderScoreboard(); renderBoard();
        });
        row.appendChild(remove);
      }

      scoreboardEl.appendChild(row);
    });

    if(state.teams.length < 6){
      var addBtn = document.createElement("button");
      addBtn.className = "add-team";
      addBtn.type = "button";
      addBtn.textContent = "+ команда";
      addBtn.addEventListener("click", function(){
        state.teams.push({id:cryptoId(), name:"Команда " + (state.teams.length+1), score:0});
        saveState(); renderScoreboard();
      });
      scoreboardEl.appendChild(addBtn);
    }
  }

  function renderBoard(){
    boardEl.innerHTML = "";
    DATA.forEach(function(cat){
      var head = document.createElement("div");
      head.className = "cat-head";
      head.textContent = cat.name;
      boardEl.appendChild(head);
    });
    for(var level=0; level<5; level++){
      DATA.forEach(function(cat, ci){
        var item = cat.q[level];
        var key = ci + "-" + level;
        var btn = document.createElement("button");
        btn.className = "tile";
        btn.type = "button";
        btn.textContent = item.p;
        btn.disabled = !!state.used[key];
        if(!btn.disabled){
          btn.addEventListener("click", function(ci, level, item){
            return function(){ openQuestion(ci, level, item); };
          }(ci, level, item));
        }
        boardEl.appendChild(btn);
      });
    }
  }

  function openQuestion(ci, level, item){
    current = {ci:ci, level:level, points:item.p};
    pillCat.textContent = DATA[ci].name;
    pillPts.textContent = item.p + " очков";
    qText.textContent = item.q;
    optsEl.innerHTML = "";
    item.options.forEach(function(opt, idx){
      var cell = document.createElement("div");
      cell.className = "opt";
      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = ["А","Б","В","Г"][idx];
      var label = document.createElement("span");
      label.textContent = opt;
      cell.appendChild(letter);
      cell.appendChild(label);
      optsEl.appendChild(cell);
    });
    current.item = item;
    aText.textContent = "Ответ: " + item.options[item.correct];
    aText.hidden = true;
    revealBtn.hidden = false;
    awardRow.hidden = true;
    awardRow.innerHTML = "";
    veil.hidden = false;
  }

  function closeModal(){
    veil.hidden = true;
    current = null;
  }

  function markUsed(){
    if(!current) return;
    state.used[current.ci + "-" + current.level] = true;
    saveState();
    renderBoard();
  }

  revealBtn.addEventListener("click", function(){
    aText.hidden = false;
    revealBtn.hidden = true;
    Array.prototype.forEach.call(optsEl.children, function(cell, idx){
      cell.classList.add(idx === current.item.correct ? "correct" : "dim");
    });

    awardRow.innerHTML = "";
    state.teams.forEach(function(team){
      var b = document.createElement("button");
      b.className = "award-btn";
      b.type = "button";
      b.innerHTML = team.name.replace(/[<>&]/g, function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}) +
        " <b>+" + current.points + "</b>";
      b.addEventListener("click", function(){
        team.score += current.points;
        saveState();
        renderScoreboard();
        markUsed();
        closeModal();
      });
      awardRow.appendChild(b);
    });

    var skip = document.createElement("button");
    skip.className = "skip-btn";
    skip.type = "button";
    skip.textContent = "Никто не ответил";
    skip.addEventListener("click", function(){
      markUsed();
      closeModal();
    });
    awardRow.appendChild(skip);

    awardRow.hidden = false;
  });

  closeBtn.addEventListener("click", closeModal);
  veil.addEventListener("click", function(e){ if(e.target === veil) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !veil.hidden) closeModal();
  });

  resetBtn.addEventListener("click", function(){
    if(!confirm("Сбросить счёт и открыть все вопросы заново?")) return;
    state.used = {};
    state.teams.forEach(function(t){ t.score = 0; });
    saveState();
    renderScoreboard();
    renderBoard();
  });

  function addVariantOption(idx){
    var o = document.createElement("option");
    o.value = idx;
    o.textContent = idx === ML_INDEX ? "ML-хардкор" : "Вариант " + (idx + 1);
    variantSel.appendChild(o);
  }
  VARIANTS.forEach(function(_, idx){ if(idx !== ML_INDEX) addVariantOption(idx); });
  if(state.variant === ML_INDEX) addVariantOption(ML_INDEX);
  variantSel.value = state.variant;
  document.body.classList.toggle("ml", state.variant === ML_INDEX);

  function switchVariant(next){
    state.variant = next;
    state.used = {};
    state.teams.forEach(function(t){ t.score = 0; });
    DATA = VARIANTS[next];
    variantSel.value = next;
    document.body.classList.toggle("ml", next === ML_INDEX);
    saveState();
    renderScoreboard();
    renderBoard();
  }

  // Пасхалка: 5 быстрых нажатий на логотип включают (и выключают) ML-хардкор.
  var logoTaps = [];
  document.getElementById("logo").addEventListener("click", function(){
    var now = Date.now();
    logoTaps = logoTaps.filter(function(t){ return now - t < 2000; });
    logoTaps.push(now);
    if(logoTaps.length < 5) return;
    logoTaps = [];
    var toMl = state.variant !== ML_INDEX;
    var started = Object.keys(state.used).length > 0 || state.teams.some(function(t){ return t.score; });
    if(started && !confirm(toMl ? "Включить ML-хардкор? Счёт и открытые вопросы сбросятся." : "Выйти из ML-хардкора? Счёт и открытые вопросы сбросятся.")) return;
    if(toMl && !variantSel.querySelector('option[value="' + ML_INDEX + '"]')) addVariantOption(ML_INDEX);
    switchVariant(toMl ? ML_INDEX : 0);
  });
  variantSel.addEventListener("change", function(){
    var next = +variantSel.value;
    var started = Object.keys(state.used).length > 0 || state.teams.some(function(t){ return t.score; });
    if(started && !confirm("Сменить вариант? Счёт и открытые вопросы сбросятся.")){
      variantSel.value = state.variant;
      return;
    }
    switchVariant(next);
  });

  renderScoreboard();
  renderBoard();
})();
</script>
